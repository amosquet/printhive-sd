name: Branch Flow Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - master
      - dev

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  enforce-branch-flow:
    name: Enforce Branching & Flow Policy
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Validate repository and branch flow rules
        id: validate
        run: |
          echo "Checking PR branch flow: '${HEAD_REPO}:${HEAD_REF}' -> '${BASE_REPO}:${BASE_REF}'"
          violation="false"
          reason=""

          # 1. Shared Repository Policy (No Personal Forks)
          if [[ "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            violation="true"
            reason="Personal forks are prohibited by the PrintHive Shared Repository Policy (doc/DevelopmentProcess.md). Please push your branch directly to ${BASE_REPO}."
          fi

          # Allow automated Dependabot branches
          if [[ "${violation}" != "true" && "${HEAD_REF}" =~ ^dependabot/ ]]; then
            echo "Dependabot branch '${HEAD_REF}' allowed."
            exit 0
          fi

          # 2. PRs targeting master must come from dev
          if [[ "${violation}" != "true" && "${BASE_REF}" == "master" ]]; then
            if [[ "${HEAD_REF}" != "dev" ]]; then
              violation="true"
              reason="Pull requests targeting 'master' must originate from 'dev' (found '${HEAD_REF}'). Feature branches must target 'dev' first."
            else
              echo "Valid release PR flow: 'dev' -> 'master'."
            fi
          fi

          # 3. PRs targeting dev must follow <username>/<feature-or-fix-being-implemented>
          if [[ "${violation}" != "true" && "${BASE_REF}" == "dev" ]]; then
            if [[ ! "${HEAD_REF}" =~ ^[a-z0-9_-]+/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              violation="true"
              reason="Branch '${HEAD_REF}' does not match the required naming convention '<username>/<feature-or-fix-being-implemented>' (lowercase username + '/' + kebab-case summary, e.g., 'artus/stl-upload-validation')."
            else
              echo "Valid feature branch '${HEAD_REF}' targeting 'dev'."
            fi
          fi

          if [[ "${violation}" == "true" ]]; then
            echo "violation=true" >> "$GITHUB_OUTPUT"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
            echo "::error::${reason}"
            exit 1
          fi

      - name: Close PR that violates the branch flow policy
        if: steps.validate.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.validate.outputs.reason }}
        run: |
          gh pr comment "${PR_NUMBER}" --body "::no_entry:: ${REASON} This pull request was closed automatically by the Branch Flow Policy workflow. Retarget the pull request to the correct base branch and reopen it."
          gh pr close "${PR_NUMBER}" --comment "Closed automatically: violates the PrintHive branch flow policy (doc/DevelopmentProcess.md)."
